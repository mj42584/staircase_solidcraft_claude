# Bloque une pull request qui modifie un modèle SolidCraft sans régénérer ses exports
# (règle « Exports » de REGLES_AGENT_3D.md). Ne régénère rien : SolidCraft ne tourne pas sur GitHub.
# Modification sans effet sur la géométrie (renommage, matériau…) : étiquette « geometrie-inchangee » sur la PR.
name: Exports à jour

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  exports:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'geometrie-inchangee') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Un modèle modifié doit avoir ses exports régénérés
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed=$(git diff --name-only "origin/$BASE_REF"...HEAD)
          # Modèle → exports qui le montrent (escalier et environnement sont liés dans le projet)
          declare -A exports=(
            [cad/escalier.solidcraft]="cad/escalier.stl cad/projet_escalier.stl cad/apercu.png"
            [cad/environnement.solidcraft]="cad/projet_escalier.stl cad/apercu.png"
            [cad/projet_escalier.solidcraft]="cad/projet_escalier.stl cad/apercu.png"
          )
          manquants=$(for modele in "${!exports[@]}"; do
            grep -qxF "$modele" <<<"$changed" || continue
            for f in ${exports[$modele]}; do grep -qxF "$f" <<<"$changed" || echo "$f"; done
          done | sort -u | tr '\n' ' ')
          if [ -n "$manquants" ]; then
            echo "::error::Modèle modifié sans ses exports : $manquants"
            exit 1
          fi
          echo "Exports à jour."
